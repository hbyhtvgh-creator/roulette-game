<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የ 0-36 እሽክርክሪት ጨዋታ</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #1a252f; color: #ecf0f1; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #2c3e50; width: 100%; max-width: 400px; padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); text-align: center; }
        h2 { margin-top: 0; color: #f1c40f; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: none; font-size: 15px; }
        input { background: #34495e; color: white; border: 1px solid #455a64; }
        input:focus { outline: none; border-color: #f1c40f; }
        button { background: #27ae60; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #2ecc71; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        .hidden { display: none; }
        .link { color: #f1c40f; cursor: pointer; font-size: 13px; margin-top: 10px; display: inline-block; text-decoration: underline; }
        
        /* የደውሉ አኒሜሽን ዲዛይን */
        .wheel-container { position: relative; width: 140px; height: 140px; margin: 20px auto; }
        .wheel-display { 
            width: 100%; height: 100%; border-radius: 50%; 
            border: 6px solid #f1c40f; background: #e74c3c; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 42px; font-weight: bold; color: white;
            transition: transform 3s cubic-bezier(0.15, 0.9, 0.15, 1);
        }
        .spinning { transform: rotate(1440deg); }
        .result-box { background: #1a252f; padding: 12px; border-radius: 8px; margin-top: 15px; text-align: left; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>

    <!-- 1. የአድሚን ሎጊን -->
    <div id="adminLoginView" class="card">
        <h2>የአድሚን መግቢያ</h2>
        <input type="text" id="adminUser" placeholder="የአድሚን ስም">
        <input type="password" id="adminPass" placeholder="ፓስወርድ">
        <button onclick="adminStep1()">1. ሎጊን በል</button>
        
        <div id="2faSection" class="hidden">
            <hr style="border-color:#455a64;">
            <p style="font-size: 13px;">የ 6 ዲጂት ኮድ ወደ ኢሜይልዎ ተልኳል፡</p>
            <input type="text" id="otpInput" placeholder="6-digit OTP">
            <button onclick="adminVerify2FA()">2. አረጋግጥና ግባ</button>
        </div>

        <span class="link" onclick="forgotPassword()">Forgot Password? (ፓስወርድ ረሳሁ)</span><br>
        <span class="link" onclick="showView('userLoginView')">ወደ ተጫዋች ገጽ ሂድ</span>
    </div>

    <!-- 2. FORGOT PASSWORD -->
    <div id="forgotPassView" class="card hidden">
        <h2>ፓስወርድ መቀየሪያ</h2>
        <p style="font-size: 13px;">ወደ ኢሜይልዎ የተላከውን ኮድ እና አዲሱን ፓስወርድ ያስገቡ፡</p>
        <input type="text" id="resetOtp" placeholder="6-digit OTP">
        <input type="password" id="newPass" placeholder="አዲስ ፓስወርድ">
        <button onclick="resetPassword()">ፓስወርድ ቀይር</button>
        <span class="link" onclick="showView('adminLoginView')">ተመለስ</span>
    </div>

    <!-- 3. የአድሚን ዳሽቦርድ -->
    <div id="adminDashboardView" class="card hidden">
        <h2>የአድሚን መቆጣጠሪያ</h2>
        <h3>አዲስ ተጫዋች ፍጠር</h3>
        <input type="text" id="newPlayerUser" placeholder="የተጫዋች ስም">
        <input type="text" id="newPlayerPass" placeholder="የተጫዋች ፓስወርድ">
        <button onclick="createPlayer()">ተጫዋች ፍጠር</button>
        <hr style="border-color:#455a64; margin: 15px 0;">
        <button class="btn-danger" onclick="showView('adminLoginView')">ውጣ (Logout)</button>
    </div>

    <!-- 4. የተጫዋች ሎጊን -->
    <div id="userLoginView" class="card hidden">
        <h2>የተጫዋች መግቢያ</h2>
        <input type="text" id="playerUser" placeholder="የተጫዋች ስም">
        <input type="password" id="playerPass" placeholder="ፓስወርድ">
        <button onclick="playerLogin()">ወደ ጨዋታው ግባ</button>
        <span class="link" onclick="showView('adminLoginView')">እኔ አድሚን ነኝ</span>
    </div>

    <!-- 5. የ 0-36 የጨዋታ ገጽ -->
    <div id="gameView" class="card hidden">
        <h2 id="welcomePlayer"></h2>
        
        <div class="wheel-container">
            <div class="wheel-display" id="wheel">0</div>
        </div>

        <h3>የጨዋታ ሂሳብ ስሌት</h3>
        <input type="number" id="entryFee" placeholder="የአንድ ምዝገባ ዋጋ (ለምሳሌ 10)" value="10">
        <input type="number" id="playerCount" placeholder="የተጫዋች ብዛት (ለምሳሌ 20)" value="20">
        <input type="number" id="cutPercentage" placeholder="የአጫዋች % ቅናሽ (ለምሳሌ 20)" value="20">
        
        <button onclick="spinWheel()" style="background:#f1c40f; color:black; font-size:17px;">ደውሉን አሽከርክር!</button>

        <div id="gameResult" class="result-box hidden"></div>
        <br>
        <button class="btn-danger" onclick="showView('userLoginView')">ውጣ (Logout)</button>
    </div>

    <script>
        const API = "https://roulette-backend-yared.onrender.com/api";

        function showView(viewId) {
            ['adminLoginView', 'forgotPassView', 'adminDashboardView', 'userLoginView', 'gameView'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
        }

        async function adminStep1() {
            const u = document.getElementById('adminUser').value;
            const p = document.getElementById('adminPass').value;
            const res = await fetch(`${API}/admin/login-step1`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: u, password: p })
            });
            const data = await res.json();
            alert(data.message);
            if (data.success) document.getElementById('2faSection').classList.remove('hidden');
        }

        async function adminVerify2FA() {
            const otp = document.getElementById('otpInput').value;
            const res = await fetch(`${API}/admin/verify-2fa`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ otp })
            });
            const data = await res.json();
            alert(data.message);
            if (data.success) showView('adminDashboardView');
        }

        async function forgotPassword() {
            const res = await fetch(`${API}/admin/forgot-password`, { method: 'POST' });
            const data = await res.json();
            alert(data.message);
            if (data.success) showView('forgotPassView');
        }

        async function resetPassword() {
            const otp = document.getElementById('resetOtp').value;
            const newPassword = document.getElementById('newPass').value;
            const res = await fetch(`${API}/admin/reset-password`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ otp, newPassword })
            });
            const data = await res.json();
            alert(data.message);
            if (data.success) showView('adminLoginView');
        }

        async function createPlayer() {
            const u = document.getElementById('newPlayerUser').value;
            const p = document.getElementById('newPlayerPass').value;
            const res = await fetch(`${API}/admin/create-user`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: u, password: p })
            });
            const data = await res.json();
            alert(data.message);
            if (data.success) {
                document.getElementById('newPlayerUser').value = '';
                document.getElementById('newPlayerPass').value = '';
            }
        }

        async function playerLogin() {
            const u = document.getElementById('playerUser').value;
            const p = document.getElementById('playerPass').value;
            const res = await fetch(`${API}/user/login`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: u, password: p })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('welcomePlayer').innerText = "እንኳን ደህና መጣህ፣ " + data.username;
                showView('gameView');
            } else {
                alert(data.message);
            }
        }

        async function spinWheel() {
            const fee = document.getElementById('entryFee').value;
            const count = document.getElementById('playerCount').value;
            const cut = document.getElementById('cutPercentage').value;
            const wheel = document.getElementById('wheel');
            const resultBox = document.getElementById('gameResult');

            // የእሽክርክሪት አኒሜሽን ማስነሳት
            wheel.classList.add('spinning');
            resultBox.classList.add('hidden');

            const res = await fetch(`${API}/game/spin`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ entryFee: fee, playerCount: count, cutPercentage: cut })
            });
            const data = await res.json();

            // ከ 3 ሴኮንድ አኒሜሽን በኋላ አሸናፊውን ማሳየት
            setTimeout(() => {
                wheel.classList.remove('spinning');
                if (data.success) {
                    wheel.innerText = data.winningNumber;
                    resultBox.classList.remove('hidden');
                    resultBox.innerHTML = `
                        🎯 <b>አሸናፊ ቁጥር፡</b> <span style="color:#f1c40f; font-size:18px;">${data.winningNumber}</span><br>
                        💰 <b>ጠቅላላ የተሰበሰበ፡</b> ${data.totalPool} ብር<br>
                        ✂️ <b>የአጫዋች ቅናሽ (${cut}%)፡</b> ${data.houseCut} ብር<br>
                        🏆 <b>ለአሸናፊው የሚሰጥ፡</b> <b style="color:#2ecc71; font-size:16px;">${data.netPrize} ብር</b>
                    `;
                }
            }, 3000);
        }
    </script>
</body>
</html>
